<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafaf8">
<title>notes from my life</title>
<style>
:root{--bg:#fafaf8;--ink:#454540;--muted:#85857e;--line:#deded8;--paper:#fdfdfa}*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;color:var(--ink);font:13px/1.8 'Helvetica Neue',Arial,sans-serif;letter-spacing:.005em}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:1px solid #777;outline-offset:5px}.shell{max-width:840px;margin:0 auto;padding:0 34px;min-height:100vh}.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}.home-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;padding:45px 0 80px;transform:translateY(-1vh)}h1{font:normal 24px/1.3 Georgia,'Times New Roman',serif;letter-spacing:-.03em;margin:0 0 8px}.subtitle{font-size:11px;color:var(--muted);margin:0}.catalog{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:55px}.nav-link,.minor-link,.month-link{background:none;border:0;padding:0;text-decoration:none;color:var(--muted)}.nav-link:hover,.minor-link:hover,.month-link:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}.home-footer{font-size:10px;color:var(--muted);text-align:center;padding:0 0 52px;line-height:1.75}.home-footer p{margin:0}.collection{padding-top:65px;padding-bottom:75px;min-height:100vh;display:flex;flex-direction:column}.topnav{display:flex;justify-content:center;gap:24px;font-size:11px}.collection-heading{text-align:center;margin:58px 0 54px;font:normal 17px/1.4 Georgia,'Times New Roman',serif}.content{width:100%;max-width:700px;margin:0 auto;flex:1}.month-layout{display:grid;grid-template-columns:125px minmax(0,1fr);gap:28px}.months{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-top:5px}.month-link{font-size:11px;line-height:1.7}.month-link.active{text-decoration:underline;text-underline-offset:4px;color:var(--ink)}.entries{display:flex;flex-direction:column;gap:18px;min-width:0}.entry{padding-left:15px;border-left:1px solid var(--line)}.slip{border:1px solid #e8e8e3;background:var(--paper);padding:13px 16px;font:normal 13px/1.75 Georgia,'Times New Roman',serif;letter-spacing:0;color:#55554f;white-space:pre-line;min-height:53px}.entry.margin-only .slip{border:0;background:transparent;padding:4px 8px}.culture-location{font-size:11px;color:var(--muted);margin:3px 0 0}.culture-group{display:flex;flex-direction:column;gap:18px;margin-bottom:30px}.slip em{font-style:italic}.collection-footer{text-align:center;font-size:10px;color:var(--muted);padding-top:86px}.entry-toggle{position:fixed;bottom:15px;right:16px;font-size:10px;color:var(--muted);display:flex;gap:9px;align-items:center}.entry-toggle button{border:0;background:transparent;font-size:10px;color:var(--muted);padding:2px}.entry-toggle button.selected{text-decoration:underline;text-underline-offset:3px;color:var(--ink)}[hidden]{display:none!important}@media(max-width:520px){.shell{padding:0 22px}.month-layout{grid-template-columns:81px minmax(0,1fr);gap:13px}.collection-heading{margin:43px 0 38px}.collection{padding-top:40px}.slip{padding:10px 11px;font-size:12px}.entry{padding-left:8px}.home-footer{padding-bottom:42px}.entry-toggle{position:static;justify-content:center;padding:0 0 20px}.entries{gap:16px}}
</style>
</head>
<body>
<div class="shell">
  <section id="home" class="home">
    <div class="home-main">
      <h1>notes from my life</h1>
      <p class="subtitle">a curious collection of disordered thoughts and questions.</p>
      <nav class="catalog" aria-label="collections">
        <button class="nav-link" data-page="month">by month</button>
        <button class="nav-link" data-page="culture">culture shocks</button>
        <button class="nav-link" data-page="questions">questions</button>
        <button class="nav-link" data-page="itch">what scratches the itch</button>
        <button class="nav-link" data-page="miscellaneous">miscellaneous</button>
      </nav>
    </div>
    <footer class="home-footer"><p>a very unofficial record of existence.</p><p>updated sporadically</p></footer>
  </section>
  <section id="collection" class="collection" hidden>
    <nav class="topnav" aria-label="page navigation"><button class="minor-link" id="home-button">← home</button><button class="minor-link" id="back-button">← back</button></nav>
    <h2 class="collection-heading" id="heading"></h2>
    <div class="content" id="content"></div>
    <footer class="collection-footer">an ongoing archive of thoughts that occurred to me</footer>
  </section>
</div>

<script src="data.js"></script>
<script>
const archive = window.ARCHIVE_DATA || {months:{},culture:[],questions:[],itch:[]};
const labels={month:'by month',culture:'culture shocks',questions:'questions',itch:'what scratches the itch',miscellaneous:'miscellaneous'};
let state={page:'home',month:Object.keys(archive.months)[0] || 'october',style:'slip'};
const home=document.querySelector('#home'),collection=document.querySelector('#collection'),content=document.querySelector('#content'),toggle=null;
function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function slipText(el,text){const parts=text.split(/(\*[^*]+\*)/g);for(const part of parts){if(part.startsWith('*')&&part.endsWith('*')&&part.length>2)el.append(node('em','',part.slice(1,-1)));else el.append(document.createTextNode(part));}}function entries(items){const wrap=node('div','entries');for(const str of items){const entry=node('article','entry');const slip=node('div','slip');slipText(slip,str);entry.append(slip);wrap.append(entry);}return wrap;}function cultureEntries(items){const wrap=node('div','culture-groups');const groups=new Map();for(const item of items){const i=item.indexOf('\n');const place=i>=0?item.slice(0,i):'other';const thought=i>=0?item.slice(i+1):item;if(!groups.has(place))groups.set(place,[]);groups.get(place).push(thought)}for(const [place,thoughts] of groups){const group=node('section','culture-group');group.append(node('div','culture-location',place),entries(thoughts));wrap.append(group)}return wrap;}
function render(){const isHome=state.page==='home';home.hidden=!isHome;collection.hidden=isHome;if(isHome){document.title='notes from my life';return;}document.querySelector('#heading').textContent=labels[state.page];document.title=labels[state.page]+' — notes from my life';content.replaceChildren();if(state.page==='month'){const layout=node('div','month-layout');const sidebar=node('nav','months');sidebar.setAttribute('aria-label','months');for(const m of Object.keys(archive.months)){const b=node('button','month-link'+(m===state.month?' active':''),m);b.setAttribute('aria-current',m===state.month?'page':'false');b.addEventListener('click',()=>{state.month=m;history.pushState({...state},'', '#month/'+m);render()});sidebar.append(b)}layout.append(sidebar,entries(archive.months[state.month]||[]));content.append(layout)}else{content.append(state.page==='culture'?cultureEntries(archive.culture||[]):entries(archive[state.page]||[]))}}
function navigate(page,month){state.page=page;if(month)state.month=month;history.pushState({...state},'',page==='home'?'#home':page==='month'?'#month/'+state.month:'#'+page);render();window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
document.querySelector('#home-button').addEventListener('click',()=>navigate('home'));
document.querySelector('#back-button').addEventListener('click',()=>{if(history.length>1)history.back();else navigate('home')});

function readHash(){const hash=decodeURIComponent(location.hash.slice(1)),[p,m]=hash.split('/');if(p==='month'){state.page='month';state.month=Object.hasOwn(archive.months,m)?m:(Object.keys(archive.months)[0] || 'october')}else state.page=Object.hasOwn(labels,p)?p:'home';render()}
window.addEventListener('popstate',readHash);readHash();
</script>
</body>
</html>
